<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>واصل الأكاديمي | المراسلة الحية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden">

  <!-- شاشة تسجيل الدخول أو إنشاء حساب -->
  <div id="authScreen" class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-indigo-950 via-slate-900 to-teal-950">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl font-extrabold mx-auto mb-3 shadow-lg">
          واصل
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">نظام المراسلة الأكاديمي</h1>
        <p class="text-sm text-slate-500 mt-1">سجّلي الدخول أو أضيفي حساباً جديداً للمراسلة الفورية</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">الاسم الكامل</label>
          <input id="userName" type="text" required placeholder="مثال: نور وادي، د. حسن، سارة..."
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">البريد الإلكتروني أو المعرّف</label>
          <input id="userEmail" type="text" required placeholder="مثال: noor@uowasit.edu.iq"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">الصفة</label>
          <select id="userRole" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
            <option value="طالب/ة">طالب / طالبة</option>
            <option value="أستاذ جامعي">أستاذ / دكتور</option>
            <option value="ضيف">ضيف / زائر</option>
          </select>
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">
          دخول إلى المحادثات
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-200">
        <p class="text-xs font-bold text-slate-500 mb-2">أو اختر حساباً مسجلاً سابقاً:</p>
        <div id="savedUsersList" class="flex flex-wrap gap-2">
          <span class="text-xs text-slate-400">جاري تحميل الحسابات...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- شاشة المحادثات الرئيسية -->
  <div id="chatScreen" class="hidden h-full flex flex-col md:flex-row">
    <!-- القائمة الجانبية للمستخدمين -->
    <aside class="w-full md:w-80 bg-white border-l border-slate-200 flex flex-col h-1/3 md:h-full">
      <div class="p-4 bg-indigo-900 text-white flex items-center justify-between">
        <div>
          <h2 id="currentUserName" class="font-bold text-base">...</h2>
          <p id="currentUserRole" class="text-xs text-indigo-200">...</p>
        </div>
        <button id="logoutBtn" class="text-xs bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg transition">
          تبديل الحساب
        </button>
      </div>

      <div class="p-3 border-b border-slate-100 bg-slate-50">
        <p class="text-xs font-bold text-slate-500">المستخدمون المتصلون والمسجلون (اضغط للمراسلة):</p>
      </div>

      <div id="contactsList" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
    </aside>

    <!-- منطقة الدردشة -->
    <main class="flex-1 flex flex-col h-2/3 md:h-full bg-slate-50">
      <header class="p-4 bg-white border-b border-slate-200 flex items-center justify-between shadow-sm">
        <div>
          <h3 id="chatTargetName" class="font-extrabold text-slate-800 text-lg">الغرفة الأكاديمية العامة</h3>
          <p id="chatTargetSub" class="text-xs text-emerald-600 font-semibold">متصل بقاعدة البيانات السحابية</p>
        </div>
        <button id="publicRoomBtn" class="text-xs bg-indigo-50 text-indigo-700 font-bold px-3 py-2 rounded-xl hover:bg-indigo-100">
          المحادثة العامة
        </button>
      </header>

      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

      <form id="messageForm" class="p-3 bg-white border-t border-slate-200 flex gap-2">
        <input id="messageInput" type="text" required autocomplete="off" placeholder="اكتب رسالتك هنا..."
          class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl transition">
          إرسال
        </button>
      </form>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://project123-21de9-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let activeChatId = "general";
    let allUsers = {};
    let allMessages = {};

    const authScreen = document.getElementById("authScreen");
    const chatScreen = document.getElementById("chatScreen");
    const savedUsersList = document.getElementById("savedUsersList");
    const contactsList = document.getElementById("contactsList");
    const messagesContainer = document.getElementById("messagesContainer");

    function sanitizeKey(str) {
      return str.trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]/g, "_");
    }

    function getPrivateRoomId(id1, id2) {
      return [id1, id2].sort().join("__");
    }

    // الاستماع الفوري لجميع الحسابات المسجلة في wasel_chat/users
    onValue(ref(db, "wasel_chat/users"), (snapshot) => {
      allUsers = snapshot.val() || {};
      renderSavedUsers();
      if (currentUser) renderContacts();
    });

    // الاستماع الفوري لجميع الرسائل في wasel_chat/messages
    onValue(ref(db, "wasel_chat/messages"), (snapshot) => {
      allMessages = snapshot.val() || {};
      if (currentUser) renderMessages();
    });

    function renderSavedUsers() {
      const usersArray = Object.values(allUsers);
      if (usersArray.length === 0) {
        savedUsersList.innerHTML = `<span class="text-xs text-slate-400">لا توجد حسابات بعد — أنشئي أول حساب أعلاه.</span>`;
        return;
      }
      savedUsersList.innerHTML = "";
      usersArray.forEach((u) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-800 font-bold px-3 py-1.5 rounded-full border border-indigo-200 transition";
        btn.textContent = `${u.name} (${u.role})`;
        btn.onclick = () => enterChat(u);
        savedUsersList.appendChild(btn);
      });
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("userName").value.trim();
      const email = document.getElementById("userEmail").value.trim();
      const role = document.getElementById("userRole").value;
      if (!name || !email) return;

      const userId = sanitizeKey(email);
      const userObj = { id: userId, name, email, role, lastSeen: Date.now() };

      await set(ref(db, `wasel_chat/users/${userId}`), userObj);
      enterChat(userObj);
    });

    function enterChat(user) {
      currentUser = user;
      authScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");
      document.getElementById("currentUserName").textContent = user.name;
      document.getElementById("currentUserRole").textContent = `${user.role} • ${user.email}`;
      renderContacts();
      renderMessages();
    }

    document.getElementById("logoutBtn").onclick = () => {
      currentUser = null;
      chatScreen.classList.add("hidden");
      authScreen.classList.remove("hidden");
    };

    document.getElementById("publicRoomBtn").onclick = () => {
      activeChatId = "general";
      document.getElementById("chatTargetName").textContent = "الغرفة الأكاديمية العامة";
      document.getElementById("chatTargetSub").textContent = "محادثة جماعية لجميع المسجلين";
      renderContacts();
      renderMessages();
    };

    function renderContacts() {
      contactsList.innerHTML = "";
      const others = Object.values(allUsers).filter((u) => u.id !== currentUser.id);
      if (others.length === 0) {
        contactsList.innerHTML = `<p class="p-4 text-xs text-slate-400 text-center">عندما يدخل شخص آخر بالرابط ويسجل اسمه سيظهر هنا فوراً.</p>`;
        return;
      }
      others.forEach((u) => {
        const roomId = getPrivateRoomId(currentUser.id, u.id);
        const isActive = activeChatId === roomId;
        const div = document.createElement("button");
        div.type = "button";
        div.className = `w-full text-right p-4 flex items-center justify-between hover:bg-indigo-50 transition ${isActive ? "bg-indigo-50 border-r-4 border-indigo-600" : ""}`;
        div.innerHTML = `
          <div>
            <div class="font-bold text-slate-800 text-sm">${u.name}</div>
            <div class="text-xs text-slate-500">${u.role}</div>
          </div>
          <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">مراسلة</span>
        `;
        div.onclick = () => {
          activeChatId = roomId;
          document.getElementById("chatTargetName").textContent = u.name;
          document.getElementById("chatTargetSub").textContent = `${u.role} (${u.email})`;
          renderContacts();
          renderMessages();
        };
        contactsList.appendChild(div);
      });
    }

    function renderMessages() {
      messagesContainer.innerHTML = "";
      const roomMsgsObj = allMessages[activeChatId] || {};
      const msgs = Object.values(roomMsgsObj).sort((a, b) => a.timestamp - b.timestamp);

      if (msgs.length === 0) {
        messagesContainer.innerHTML = `<div class="text-center text-xs text-slate-400 my-10">لا توجد رسائل في هذه المحادثة بعد. ابدأ بكتابة أول رسالة!</div>`;
        return;
      }

      msgs.forEach((m) => {
        const isMine = m.senderId === currentUser.id;
        const wrapper = document.createElement("div");
        wrapper.className = `flex flex-col ${isMine ? "items-start" : "items-end"}`;
        const timeStr = new Date(m.timestamp).toLocaleTimeString("ar-IQ", { hour: "2-digit", minute: "2-digit" });

        wrapper.innerHTML = `
          <div class="max-w-xs md:max-w-md px-4 py-2.5 rounded-2xl shadow-sm ${isMine ? "bg-indigo-600 text-white rounded-br-none" : "bg-white text-slate-800 border border-slate-200 rounded-bl-none"}">
            <div class="text-[11px] font-bold mb-1 ${isMine ? "text-indigo-200" : "text-indigo-600"}">${m.senderName}</div>
            <div class="text-sm leading-relaxed break-words">${m.text}</div>
            <div class="text-[10px] mt-1 text-left ${isMine ? "text-indigo-200" : "text-slate-400"}">${timeStr}</div>
          </div>
        `;
        messagesContainer.appendChild(wrapper);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    document.getElementById("messageForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      await push(ref(db, `wasel_chat/messages/${activeChatId}`), {
        senderId: currentUser.id,
        senderName: currentUser.name,
        text,
        timestamp: Date.now()
      });
    });
  </script>
</body>
</html>
